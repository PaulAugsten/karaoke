name: Setup Node + pnpm
description: Installs pnpm (version from package.json#packageManager) and Node (from .nvmrc), then does a frozen install.

# Shared by every workflow job that needs the toolchain, so the
# setup steps (and their pinned SHAs) live in exactly one place.
# Callers must run actions/checkout first.
runs:
    using: composite
    steps:
        - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
          with:
              node-version-file: .nvmrc
              cache: pnpm
        - run: pnpm install --frozen-lockfile
          shell: bash
