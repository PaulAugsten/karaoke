name: Labeler

# pull_request_target so it can label PRs from forks too. Safe here because
# the job never checks out or runs the PR's code - it only reads the changed paths.
on:
    pull_request_target:
        types: [opened, synchronize, reopened]

permissions:
    contents: read

jobs:
    label:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
