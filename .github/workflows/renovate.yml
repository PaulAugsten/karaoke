name: Renovate

# Config: .github/renovate.json5. Self-hosted so PRs are opened with our own token
# (which, unlike GITHUB_TOKEN, triggers CI on them) and commits carry our identity.
# Deliberately has no pull_request trigger: fork PRs must never reach this token.
on:
    schedule:
        # Every 2h on Mondays: later passes rebase PRs left behind main by an earlier automerge
        - cron: "0 */2 * * 1"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: renovate
    cancel-in-progress: false

jobs:
    renovate:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            # Fine-grained PAT. Read and write: Contents, Pull requests, Issues, Workflows,
            # Commit statuses. Read-only: Dependabot alerts (for security updates).
            RENOVATE_TOKEN: ${{ secrets.CI_AUTOMATION_TOKEN }}
        steps:
            - name: Skip until CI_AUTOMATION_TOKEN is set
              if: env.RENOVATE_TOKEN == ''
              run: echo "::warning::Add the CI_AUTOMATION_TOKEN secret to enable Renovate."
            - uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
              if: env.RENOVATE_TOKEN != ''
              with:
                  token: ${{ env.RENOVATE_TOKEN }}
              env:
                  RENOVATE_REPOSITORIES: ${{ github.repository }}
                  RENOVATE_GIT_AUTHOR: PaulAugsten <58978786+PaulAugsten@users.noreply.github.com>
