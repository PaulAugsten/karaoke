name: E2E (preview)

# Vercel fires deployment_status when a preview build finishes, carrying the
# preview URL in target_url. We run Playwright against that URL instead of a
# locally-built copy, so the gate is the deploy that will actually ship.
on:
    deployment_status:

permissions:
    contents: read

concurrency:
    group: e2e-${{ github.event.deployment.sha }}
    cancel-in-progress: true

jobs:
    e2e:
        # Only run once Vercel reports a successful preview deploy (skip production
        # deploys and the in-progress/queued/failure states of this same event).
        if: |
            github.event.deployment_status.state == 'success' &&
            github.event.deployment.environment == 'preview'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
            - run: pnpm exec playwright install --with-deps
            - name: Run Playwright against the preview URL
              run: pnpm test:e2e
              env:
                  BASE_URL: ${{ github.event.deployment_status.target_url }}
                  # Set this repo secret if Vercel Deployment Protection is on for
                  # previews; otherwise tests will just hit the protection login page.
                  VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 14

    # categories:seo is only "warn" in lighthouserc.json: Vercel sets
    # X-Robots-Tag: noindex on every preview deployment, which fails Lighthouse's
    # is-crawlable audit regardless of actual SEO quality.
    lighthouse:
        if: |
            github.event.deployment_status.state == 'success' &&
            github.event.deployment.environment == 'preview'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Lighthouse CI
              uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
              with:
                  # Lighthouse can't set custom headers, so get past Vercel Deployment
                  # Protection via query param instead. Add more URLs as pages appear.
                  urls: |
                      ${{ github.event.deployment_status.target_url }}/?x-vercel-protection-bypass=${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}&x-vercel-set-bypass-cookie=true
                  configPath: ./lighthouserc.json
                  uploadArtifacts: true
