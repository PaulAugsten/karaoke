name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

# Cancel superseded runs on the same branch/PR to save minutes.
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    # Repo-wide hygiene hooks from .pre-commit-config.yaml (actionlint, YAML, EOF, ...).
    # Hooks that have a dedicated job below or workflow (gitleaks.yml) are skipped here.
    pre-commit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - run: pipx run pre-commit run --all-files --show-diff-on-failure
              env:
                  SKIP: gitleaks,lint,lint-next,typecheck,build

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
            - run: pnpm lint
            - run: pnpm lint:next

    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
            - run: pnpm typecheck

    knip:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
            - run: pnpm knip

    unit:
        runs-on: ubuntu-latest
        env:
            # Exposed as env so the upload step can be skipped until the secret exists.
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
            - run: pnpm test:coverage
            - name: Upload coverage
              if: env.CODECOV_TOKEN != ''
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  token: ${{ env.CODECOV_TOKEN }}
                  fail_ci_if_error: true

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
            - run: pnpm build
              env:
                  NEXT_TELEMETRY_DISABLED: "1"
                  # Source map upload + release creation no-op until these secrets exist.
                  SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
                  SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
            # Flat budget against this build's own output (see .size-limit.json).
            - run: pnpm size

    # Runs semantic-release after CI passes on an actual push to main.
    release:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [pre-commit, lint, typecheck, knip, unit, build]
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
        # Separate from the workflow-level concurrency group above: a release in
        # progress must never be cancelled mid-push by a newer commit landing on main.
        concurrency:
            group: release-main
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  # Deploy key with write access, on the main ruleset's bypass list (see
                  # scripts/setup-github.sh), so the release commit can push straight to
                  # main despite the "require PR" rule. Scoped to just this key.
                  ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
            - uses: ./.github/actions/setup
            - run: pnpm exec semantic-release
              env:
                  # Releases created with GITHUB_TOKEN don't trigger other workflows.
                  GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
                  GIT_AUTHOR_NAME: PaulAugsten
                  GIT_AUTHOR_EMAIL: 58978786+PaulAugsten@users.noreply.github.com
                  GIT_COMMITTER_NAME: PaulAugsten
                  GIT_COMMITTER_EMAIL: 58978786+PaulAugsten@users.noreply.github.com

    # The `production` GitHub Environment (required reviewers, wait timer, scoped
    # secrets) gates this job. Vercel's own auto-deploy for main is disabled via
    # vercel.json (git.deploymentEnabled.main: false) so this is the only path a
    # production deploy can take; preview deploys for other branches/PRs still
    # happen automatically through Vercel's Git integration.
    #
    # Deploys via a *remote* build (no --prebuilt), deliberately: env vars marked
    # "Sensitive" in Vercel can't be read back by `vercel pull`, only by a build
    # running inside Vercel, so a local prebuilt flow would bake in empty strings.
    deploy:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [pre-commit, lint, typecheck, knip, unit, build]
        runs-on: ubuntu-latest
        environment: production
        concurrency:
            group: deploy-production
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - run: npx --yes vercel@64.7.0 deploy --prod --token="$VERCEL_TOKEN"
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
