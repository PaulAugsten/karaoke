name: PR title

# PRs are squash-merged with the PR title as the commit message on main, so the
# title - not the branch commits - is what drives the release version/changelog.
on:
    pull_request:
        types: [opened, edited, synchronize, reopened]

permissions:
    contents: read

jobs:
    conventional:
        runs-on: ubuntu-latest
        permissions:
            pull-requests: read
        steps:
            - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
